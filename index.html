<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DBMS Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Zilla+Slab:wght@500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6DEC9;--surface:#F3ECDB;--ink:#2A2118;--mute:#6B5D49;--line:#BDAF92;--accent:#8A2D1C;--on-accent:#F3ECDB;--mark:#E8C766;--mark-ink:#2A2118;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1710;--surface:#2A2218;--ink:#EBE0C8;--mute:#A89B82;--line:#4A3E2D;--accent:#D9A441;--on-accent:#1D1710;--mark:#7A5A12;--mark-ink:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1710;--surface:#2A2218;--ink:#EBE0C8;--mute:#A89B82;--line:#4A3E2D;--accent:#D9A441;--on-accent:#1D1710;--mark:#7A5A12;--mark-ink:#fff;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 "Literata",Georgia,serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit}button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.ui{font-family:"Special Elite","Courier New",monospace}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:.8rem 1rem;align-items:center;flex-wrap:wrap;padding:.7rem clamp(1rem,4vw,2.5rem);background:var(--bg);border-bottom:1px solid var(--line);font-family:"Special Elite","Courier New",monospace}
.brand{font-weight:700;font-size:1.35rem;line-height:1;text-decoration:none;letter-spacing:-.01em;margin-right:auto}
nav.tabs{display:flex;gap:.25rem}
nav.tabs a{font-weight:500;font-size:.95rem;padding:.45rem .85rem;border-radius:3px;text-decoration:none;color:var(--mute)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs small{margin-left:.3rem;font-size:.8rem}
.search{flex:1 1 260px;max-width:460px;display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:.1rem .9rem}
.search input{flex:1;min-width:0;border:0;background:none;color:inherit;font:500 1rem "Special Elite","Courier New",monospace;padding:.5rem 0}
.search input:focus{outline:none}.search:focus-within{outline:3px solid var(--accent)}
kbd{font:500 .75rem "Special Elite","Courier New",monospace;border:1px solid var(--line);border-radius:5px;padding:.05rem .4rem;color:var(--mute)}
main{max-width:1120px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,2.5rem) 4rem}
h1,h2,h3{font-family:"Zilla Slab",Georgia,serif;letter-spacing:-.015em;margin:0}
h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1;max-width:15ch;margin:1.5rem 0 .8rem}
h2.vt{font-size:clamp(1.6rem,3.6vw,2.3rem);line-height:1.1}
.lede{color:var(--mute);max-width:54ch;margin:0 0 1.8rem}
.sub{color:var(--mute);margin:.2rem 0 .7rem}
.crumb{display:flex;gap:.5rem;font:500 .92rem "Special Elite","Courier New",monospace;color:var(--mute);margin-bottom:.8rem}
.crumb a{text-decoration:none;border-bottom:1px solid var(--line)}.crumb span::before{content:"/";margin-right:.5rem}
/* shelf */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.big{display:flex;flex-direction:column;gap:.5rem;text-decoration:none;border-radius:3px;padding:1.6rem;min-height:210px;color:#F1E8D2;background:var(--c);box-shadow:inset -6px 0 0 rgba(0,0,0,.25)}
.big b{font:700 2.2rem/1 "Zilla Slab",serif}.big span{max-width:26ch;opacity:.9}.big em{margin-top:auto;font-style:normal}
.badge{display:grid;place-items:center;width:2.6rem;height:2.6rem;background:var(--c,#7A2A22);color:#F1E8D2;font:700 1.25rem "Zilla Slab",serif;border-radius:2px;flex:none}
.shelf{display:flex;align-items:flex-end;gap:4px;height:410px;padding:0 12px;margin:1.6rem 0 .6rem;border-bottom:16px solid #5A3F25;overflow-x:auto;overflow-y:hidden}
.book{--w:64px;flex:0 0 var(--w);width:auto;height:var(--ht);display:flex;overflow:hidden;background:var(--c);color:#F1E8D2;text-decoration:none;border-radius:2px 2px 0 0;box-shadow:inset -4px 0 0 rgba(0,0,0,.28),inset 3px 0 0 rgba(255,255,255,.08);transition:flex-basis .35s}
.spine{flex:none;width:var(--w);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.8rem 0 .7rem}
.spine .no{background:#F1E8D2;color:#2A2118;padding:.05rem .4rem;font:700 1rem "Zilla Slab",serif;transform:rotate(-3deg)}
.spine .tt{writing-mode:vertical-rl;font-size:1.02rem;line-height:1.15;letter-spacing:.03em;max-height:calc(100% - 4.5rem);overflow:hidden}
.spine .ct{font-size:.85rem;opacity:.75}
.cover{flex:none;width:292px;display:flex;flex-direction:column;gap:.3rem;padding:1rem 1rem 1rem 1.1rem;background:var(--surface);color:var(--ink);border-left:4px solid rgba(0,0,0,.45);opacity:0;transition:opacity .15s}
.book:hover,.book:focus-visible,.book.on{flex-basis:calc(var(--w) + 292px)}
.book:hover .cover,.book:focus-visible .cover,.book.on .cover{opacity:1;transition:opacity .25s .15s}
.cover h3{font-size:1.25rem;line-height:1.15}.cover p{margin:0;font-size:.92rem;color:var(--mute)}
.cover ul{list-style:none;padding:0;margin:.2rem 0;font-size:.88rem}.cover li{display:flex;justify-content:space-between;gap:.6rem;border-bottom:1px dotted var(--line);padding:.12rem 0}
.cover .yr{font:700 2.6rem/1 "Zilla Slab",serif;color:var(--c)}
.cover .open{margin-top:.4rem;font-weight:700;border-bottom:2px solid var(--c);align-self:flex-start}
.cover .bar{margin-top:.5rem}
.bar{height:6px;background:var(--line);border-radius:0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.hint{color:var(--mute);font-size:.9rem;margin:.2rem 0 0}
.mh{display:flex;gap:1rem;align-items:center;margin:.3rem 0 1rem}
#prog{max-width:340px}#prog span{font:500 .88rem "Special Elite","Courier New",monospace;color:var(--mute)}
/* controls */
.pills,.filters{display:flex;gap:.45rem;flex-wrap:wrap;margin:.6rem 0}
.chip{font:500 .92rem "Special Elite","Courier New",monospace;padding:.4rem .85rem;border:1px solid var(--line);border-radius:3px;background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip small{opacity:.7;margin-left:.35rem}
select.chip{border-radius:3px;padding-right:.5rem}
h3.th{font-size:1.2rem;margin:1.8rem 0 .7rem;display:flex;gap:.7rem;align-items:baseline;border-top:1px solid var(--line);padding-top:1rem}
h3.th span{color:var(--mute);font-weight:500;font-size:.95rem}
/* question */
.q{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:1rem 1.2rem;margin:0 0 .9rem;scroll-margin-top:90px}
.q.done{opacity:.62}
.q header{display:flex;flex-wrap:wrap;gap:.2rem .9rem;align-items:baseline;font:500 .9rem "Special Elite","Courier New",monospace;color:var(--mute);margin-bottom:.5rem}
.q header b{color:var(--ink);font-weight:700}.q header .mk{margin-left:auto}
.q .body{white-space:pre-wrap;max-width:74ch;overflow-wrap:anywhere}
.q:not(.open) .body{max-height:5.4em;overflow:hidden;cursor:pointer;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.q:not(.open) img{display:none}
.q img{max-width:100%;height:auto;border-radius:8px;margin-top:.8rem;background:#fff;border:1px solid var(--line)}
.q footer{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;margin-top:.8rem}
.tags,.acts{display:flex;flex-wrap:wrap;gap:.4rem}
.tags a{font:500 .82rem "Special Elite","Courier New",monospace;padding:.15rem .6rem;border:1px solid var(--line);border-radius:3px;text-decoration:none;color:var(--mute)}
.tags a:hover{color:var(--ink);border-color:var(--ink)}
.acts button{font:500 .86rem "Special Elite","Courier New",monospace;padding:.25rem .75rem;border:1px solid var(--line);border-radius:3px;background:none;cursor:pointer}
.acts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q.short [data-act="open"]{display:none}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 .1em}
.empty{padding:1.5rem;border:1px dashed var(--line);border-radius:3px;color:var(--mute);margin-top:1rem}
footer.note{max-width:1120px;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem) 3rem;color:var(--mute);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<script>
const D={"modules":[{"n":1,"title":"Database Systems Concepts & Architecture","topics":["Data Models & Three-Schema Architecture","DBMS Architectures"]},{"n":2,"title":"Relational Model & E-R Modeling","topics":["ER Model","Extended ER Model","Mapping ER to Relational Schema"]},{"n":3,"title":"Relational Database Design","topics":["Functional Dependencies & Axioms","Normalization (1NF–BCNF)","Lossless Decomposition & Dependency Preservation"]},{"n":4,"title":"Physical Design & Query Processing","topics":["File Organization & Indexing","B+ Tree Indexing","Hashing Techniques","Relational Algebra & SQL","Query Processing & Optimization"]},{"n":5,"title":"Transaction Processing & Recovery","topics":["Transaction Concepts & ACID","Schedules & Serializability","Recovery Techniques"]},{"n":6,"title":"Concurrency Control","topics":["Concurrency Problems","Timestamp-Based Protocols","Lock-Based Protocols & 2PL","Deadlock Handling","Multi-Granularity Locking"]},{"n":7,"title":"NoSQL Database Management","topics":["CAP Theorem","NoSQL Database Types"]},{"n":8,"title":"Contemporary Issues","topics":["Contemporary Issues"]}],"papers":[{"id":"FAT-B2-2022-23","slot":"B2+TB2","term":"Apr/May 2023","year":2023,"acad":"2022-23","n":8},{"id":"FAT-A1-2023-24","slot":"A1+TA1","term":"Jul 2023","year":2023,"acad":"2023-24","n":10},{"id":"FAT-F2-2023-24","slot":"F2+TF2","term":"Jul/Aug 2023","year":2023,"acad":"2023-24","n":9},{"id":"FAT-A1-2024-25","slot":"A1+TA1","term":"Nov 2024","year":2024,"acad":"2024-25","n":10},{"id":"FAT-A2-2024-25","slot":"A2+TA2","term":"Nov 2024","year":2024,"acad":"2024-25","n":12},{"id":"FAT-B1-2025-26","slot":"B1+TB1","term":"Nov 2025","year":2025,"acad":"2025-26","n":12},{"id":"FAT-B2-2025-26","slot":"B2+TB2","term":"Nov 2025","year":2025,"acad":"2025-26","n":12},{"id":"FAT-E1-2025-26","slot":"E1+TE1","term":"Nov/Dec 2025","year":2025,"acad":"2025-26","n":10}],"questions":[{"id":"FAT-B2-2022-23|1","paper":"FAT-B2-2022-23","qno":"1","marks":10,"co":"","bl":"","tags":[[1,"Data Models & Three-Schema Architecture"]],"text":"An airline ticket booking database is designed to maintain geographically distributed reservations and to schedule information about the airline system. The secondary storage device holds information in the form of bytes and words. Previously, the computation was performed directly on this airline data. Because of the difficulty in obtaining and altering this data, the physical information was hidden and the data were presented as a series of tables. To make the data more intelligible to a greater number of individuals, the data might be presented in a variety of ways to accommodate the diverse audience. Discuss in detail the database architecture required to execute such mapping with appropriate record types or tables."},{"id":"FAT-B2-2022-23|2","paper":"FAT-B2-2022-23","qno":"2","marks":10,"co":"","bl":"","tags":[[5,"Schedules & Serializability"]],"text":"Check whether the given schedule S is conflict serializable, recoverable schedule or not. If it is conflict serializable, determine an equivalent serialized schedule. [10 marks]\nSchedule S (operations in time order, given as a T1–T4 table): T4: R(A); T2: R(A); T3: R(A); T1: W(B); T2: W(A); T3: R(B); T2: W(B)."},{"id":"FAT-B2-2022-23|3","paper":"FAT-B2-2022-23","qno":"3","marks":10,"co":"","bl":"","tags":[[7,"NoSQL Database Types"]],"text":"An ABC Apartment with 1000 families would like to implement a system to manage various amenities in the Club House, like Gym, Yoga Hall, Swimming Pool, Mini Theater, Table Tennis Board Room, Tennis Court, etc. Each resident can avail any of these services from 8 am – 8 pm in one hour slot per activity/day. Without booking, no service can be availed and the system manager decides to use the NoSQL database to store the details.\n(a) Create the following collections [3 marks]\n i. \"Residents\" to store each member with a unique MemberID, Name, Phone number, ApartmentNumber.\n ii. \"Amenities\" to store details like AmenityID, Amenity, InchargeName, InchargePhoneNumber of the club house.\n iii. \"BookAmenity\" to store documents with AmenityID, MemberID, Date, Slot [8 AM-9 AM, 9 AM-10 AM, ... 7 PM-8 PM].\n(b) Insert two documents in each collection with data of your choice. [2 marks]\n(c) New Gym trainer in charge got appointed and update his name, number in the \"Amenities\" collection. [1 mark]\n(d) System manager wants to take the list of residents who utilise the amenities most, so display the MemberID, AmenityID along with their count in descending order. [2 marks]\n(e) One of the families who stayed in 101 Apartment number got vacated and all the respective member documents need to be deleted in \"Residents\" collection. [2 marks]"},{"id":"FAT-B2-2022-23|4","paper":"FAT-B2-2022-23","qno":"4","marks":10,"co":"","bl":"","tags":[[4,"Relational Algebra & SQL"]],"text":"Consider the below-given schema of the hotel reservations database:\nHotel (HotelNo, Name, City)\nRoom (RoomNo, Hotel_No, Type, Price)\nBooking (HotelNo, GuestNo, FromDate, ToDate, RoomNo)\nGuest (GuestNo, Name, City)\nWrite SQL queries for the following: [4 × 2.5 = 10 Marks]\na) Get the details (print name and price) of all hotels in Bangalore.\nb) Get the average price of a room grouped by city.\nc) Find the name and city of the hotel which has the highest-priced room.\nd) Print the hotel names and room numbers of all hotels in Chennai which have rooms available at present."},{"id":"FAT-B2-2022-23|5","paper":"FAT-B2-2022-23","qno":"5","marks":15,"co":"","bl":"","tags":[[2,"Mapping ER to Relational Schema"]],"text":"Assume person X is planning to start an online shopping system to purchase some products and perform home delivery of the purchased products. He has identified some of the following entities, attributes and some information. Consider each customer will be assigned a unique id and each product on the shopping page will have a unique number. Similarly, for every order placed by the customer unique order number will be generated and after the successful payment of the bill, a payment id will be assigned. In this online shopping system, a customer places one or more order(s), the placed order includes one or more product(s), the placed order is associated with one payment and payment is associated with one order. Based on the above information:\ni) Design an ER diagram with appropriate cardinality ratios (7 marks).\nii) Map the designed ER model to a relational schema (8 marks).\nEntities & Attributes\nCustomer: customer_id [PK], name, email, address\nProduct: product_id [PK], name, price, description\nOrder: order_id [PK], order_date, customer_id [FK]\nPayment: payment_id [PK], payment_date, amount, order_id [FK]"},{"id":"FAT-B2-2022-23|6","paper":"FAT-B2-2022-23","qno":"6","marks":15,"co":"","bl":"","tags":[[3,"Functional Dependencies & Axioms"],[3,"Normalization (1NF–BCNF)"]],"text":"i. Given a set of Functional Dependencies (FD), identify the redundant FD(s) and remove it with a suitable explanation. FD = {C->A, B->X, AX->Y, CB->Y} (3 Marks)\nii. Consider a relational schema R(A,B,C,D,E) and a set of functional dependencies FD = {A->BC, AC->E, B->D, E->AB}\na) Identify the minimal cover of R and explain the same (4 marks)\nb) Identify the candidate keys of R and explain the same (4 marks)\nc) Normalize the relation R to BCNF standard and give a suitable explanation (4 marks)"},{"id":"FAT-B2-2022-23|7","paper":"FAT-B2-2022-23","qno":"7","marks":15,"co":"","bl":"","tags":[[4,"Query Processing & Optimization"],[4,"B+ Tree Indexing"]],"text":"(i) Consider the given relation schema: Student(Reg_no, stu_name, CGPA), Course(ccode, cname, credits), Course_student(Regno, stu_name, ccode).\nDraw the query evaluation plan/tree using the heuristic optimization technique for the following query: \"List the courses with more than 4 credits which were taken by the student 'John'\". [8 Marks]\n(ii) Consider the following Relation (Cust_Id, Cust-name, Item, Price, Quantity): (1111, Jennifer, Deodorant, 1000, 2); (8888, Charles, Talcum Powder, 2200, 5); (6666, George, Talcum Powder, 2800, 8); (5555, Chris, Perfume, 3100, 3); (7777, Cheery, Deodorant, 3800, 1); (3333, Joseph, Perfume, 2200, 1); (4444, Pamila, Deodorant, 1500, 7).\nConstruct the B+ tree with order=4 by inserting the above records in the same sequence. Delete the records which have the values of as '3333' & '4444', and then insert the record: (2222,'John','Talcum Powder',15000,3). [7 Marks]"},{"id":"FAT-B2-2022-23|8","paper":"FAT-B2-2022-23","qno":"8","marks":15,"co":"","bl":"","tags":[[6,"Lock-Based Protocols & 2PL"],[6,"Deadlock Handling"]],"text":"Consider the following two schedules (Schedule S1 and Schedule S2) given below. They are performing operations on the data items A, B, C, and D and are submitted to the database system for execution in the given order. (Assume, S, and X are the shared and exclusive locks respectively):\nS1: T4:X(A), T3:S(C), T1:S(B), T2:X(B), T3:X(C), T2:X(A), T1:S(C), T4:S(B)\nS2: T1:X(A), T3:S(D), T3: S(A), T4:X(C), T2:S(B), T4:X(A), T2:X(C), T1:X(B), T4:X(D)\nAnswer the following questions by considering each schedule independently. For both the schedule sequences S1 and S2,\na. For each request shown in the schedule, mention whether the request is granted or blocked by the lock manager. [7 Marks]\nb. Show the waits-for graph and indicate whether there will be a deadlock or not at the end of each sequence. [8 Marks]"},{"id":"FAT-A1-2023-24|1","paper":"FAT-A1-2023-24","qno":"1","marks":10,"co":"","bl":"","tags":[[1,"Data Models & Three-Schema Architecture"]],"text":"a) [5] Consider a typical online course registration system such as Coursera or Udacity. How do you enforce the concept of data abstraction and data independence by elaborating each level of abstraction with your example?\nb) [5] Describe briefly the function of the catalog in a DBMS. Show clearly how the catalog allows the DBMS to provide data independence and why data modelling is important?"},{"id":"FAT-A1-2023-24|2","paper":"FAT-A1-2023-24","qno":"2","marks":10,"co":"","bl":"","tags":[[2,"ER Model"]],"text":"Major airline companies that provide passenger services in Singapore are UniAir, TransAsia Airways, Far Eastern Transport, Great China Airlines, etc. Singapore Federal Flight Administration (SFFA) keeps a database with lots of information on all airlines. The information consists of: Each airplane has an identification number, name of the contact person, and telephone number. For each aircraft identification number, capacity and model are recorded.\nEach employee has an employee identification number, name, address, birthday, sex, position with the company and qualification.\nEach route has a route identification number, origin, destination, classification (into domestic or international route), distance of the route and price charged per passenger.\nEach airline keeps the information about their buy/sell transactions (for example, selling an airplane ticket is a sell transaction, and paying for maintenance is a buy transaction). Each transaction has a transaction identification number, date, description, and amount of money paid/received.\nDesign a suitable ER diagram for the above scenario with all possible entities, attributes and the corresponding relationship with its participations."},{"id":"FAT-A1-2023-24|3","paper":"FAT-A1-2023-24","qno":"3","marks":10,"co":"","bl":"","tags":[[3,"Functional Dependencies & Axioms"],[3,"Normalization (1NF–BCNF)"]],"text":"a) [5] A relation IADDR is defined with attributes NAME (unique), STREET, CITY, STATE and POSTCODE for storing the customer address details. The functional dependencies of the relation are given below:\nPOSTCODE → CITY, STATE\nSTREET, CITY, STATE → POSTCODE\nNAME → STREET, CITY, STATE\nCheck if the given relation is in BCNF? 3NF? 2NF?\nb) [5] Consider the following relation scheme R (A, B, C, D, E, F, G, H, I, J) together with the following functional dependencies: {F→ H, E}, {{C, G, A}→{B, D, J}}, {{B}→{A, I}}, {B, G}→ {C}. Use Armstrong's axioms to prove formally that this set of functional dependencies implies that {B, G} → {D}."},{"id":"FAT-A1-2023-24|4","paper":"FAT-A1-2023-24","qno":"4","marks":10,"co":"","bl":"","tags":[[3,"Lossless Decomposition & Dependency Preservation"]],"text":"A relation R has attributes A, B, C, D, E, and satisfies the following FDs: A→BC, B→D, CD→E, E→A\na) [3] Show that (A, B, C) and (A, D, E) are a lossless decomposition of R.\nb) [3] Show that (A, B, C) and (C, D, E) are not a lossless decomposition of R.\nc) [4] Show that (A, B, C) and (A, D, E) are not a dependency preserving decomposition of R."},{"id":"FAT-A1-2023-24|5","paper":"FAT-A1-2023-24","qno":"5","marks":10,"co":"","bl":"","tags":[[4,"Query Processing & Optimization"]],"text":"Consider the following tables. Write a SQL to find out the customer id of any customer who has ordered the product \"Queso Cabrales\" with quantity >6. Transform the SQL into a collection of relational algebra which denotes different execution plans of the SQL. Also, visualize the answer with the help of the Query tree.\nOrders: (10263, Wilmk); (10311, Dumon) [Order ID, Customer ID]\nProducts: (11, Queso Cabrales); (42, Singaporena Fried); (69, Gudbrandsdalsost); (72, Mozzarella di Giovanni) [Product ID, Product Name]\nOrders Details [OrderID, ProductID, UnitPrice, Quantity]: (10263, 11, 21.00, 12); (10263, 42, 14.00, 10); (10263, 72, 34.80, 5); (10311, 42, 14.00, 6); (10311, 69, 28.80, 7)"},{"id":"FAT-A1-2023-24|6","paper":"FAT-A1-2023-24","qno":"6","marks":10,"co":"","bl":"","tags":[[4,"B+ Tree Indexing"]],"text":"Consider a B+-tree of order three. Show the results of entering one by one the keys that are three letter strings: (era, ban, bat, kin, day, log, rye, max, won, ace, ado, bug, cop, gas, let, fax) (in that order) to an initially empty B+-tree. Assume that you use lexicographic ordering to compare the strings. Show the state of the tree after every 4 insertions."},{"id":"FAT-A1-2023-24|7","paper":"FAT-A1-2023-24","qno":"7","marks":10,"co":"","bl":"","tags":[[5,"Schedules & Serializability"]],"text":"Consider the following 3 schedules for 3 concurrent transactions T1, T2, T3\nS1 = {r2(c), r2(b), w2(b), r3(b), r3(d), r3(c), r1(a), w1(a), w3(b), w3(c), r2(a), r2(d), w2(d), r1(b), w1(b), w2(a)}\nS2 = {r3(b), r3(c), r3(d), r1(a), w1(a), w3(b), w3(c), r2(c), r1(b), w1(b), r2(b), w2(b), r2(a), w2(a), r2(d), w2(d)}\nS3 = {r1(a), w1(a), r2(c), r2(b), w2(b), r2(d), r2(a), w2(a), w2(d), r1(b), w1(b), r2(b), r3(b), r3(c), w3(b), w3(c), r3(d)}\nFor each of the three interleaved schedules, determine if the schedule is serializable. If so give an equivalent serial schedule."},{"id":"FAT-A1-2023-24|8","paper":"FAT-A1-2023-24","qno":"8","marks":10,"co":"","bl":"","tags":[[6,"Timestamp-Based Protocols"]],"text":"Discuss the timestamp ordering protocol for concurrency control. How does strict timestamp ordering differ from basic timestamp ordering?"},{"id":"FAT-A1-2023-24|9","paper":"FAT-A1-2023-24","qno":"9","marks":10,"co":"","bl":"","tags":[[5,"Recovery Techniques"],[6,"Deadlock Handling"]],"text":"a) [5] Describe the shadow paging recovery technique.\nb) [5] Prove that the wait-die and wound-wait protocols avoid deadlock and starvation."},{"id":"FAT-A1-2023-24|10","paper":"FAT-A1-2023-24","qno":"10","marks":10,"co":"","bl":"","tags":[[7,"CAP Theorem"],[7,"NoSQL Database Types"]],"text":"a) [5] Consider an e-commerce website with a global presence. Some of the key areas for data management are maintaining user sessions, secured and reliable financial data management, shopping cart management, recommendation of products, maintaining product catalog, generating reports, performing analytics, and logging user activities. For the above scenario, choose the appropriate database and justify in terms of CAP theorem and BASE properties.\nb) [5] Which of the four NoSQL database types is more suitable for storing session details? Justify by explaining the features of the database chosen."},{"id":"FAT-F2-2023-24|1","paper":"FAT-F2-2023-24","qno":"1","marks":10,"co":"","bl":"","tags":[[1,"DBMS Architectures"]],"text":"Assume that an online retail store called \"HappyShoppy\" has experienced rapid growth in its customer base and product inventory.\na. Identify and elaborate the kind of DBMS architecture needed to manage their operations efficiently with a neat diagram. (8 Marks)\nb. Mention the benefits of chosen architecture (2 Marks)"},{"id":"FAT-F2-2023-24|2","paper":"FAT-F2-2023-24","qno":"2","marks":10,"co":"","bl":"","tags":[[2,"Mapping ER to Relational Schema"]],"text":"[DIAGRAM: ER model with entities STUDENT (student_id, student_name, age (derived), hobby (multivalued), dob, composite ADDRESS: door#, street, city, state, pin), COURSE (course_id, course_name), SUBJECTS (subject_id, subject_name), LECTURER (lecturer_id, lecturer_name, course_id); relationships Attends (Student M:N Course), Takes, HAS (Course 1:M Subjects), Teaches (Student–Lecturer and Lecturer–Subjects).]\na. Map the above E-R model to appropriate relation schema. (5 Marks)\nb. Determine the primary key, foreign key, and any other appropriate constraints in the mapped schema and also describe the purpose of each constraints. (5 Marks)","fig":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAHKAvoDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECBAUDBgf/xABQEAABAwMCAwQGBwMICAQGAwABAAIDBAURITESQVEGE2FxFCIygZHBFSNCcqGx0TNSYhYkJTRDU4LCNURjc5KisuEHg9LwJkVVZGWTdLPi/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/8QAFhEBAQEAAAAAAAAAAAAAAAAAABEB/9oADAMBAAIRAxEAPwD37fwXQLmFMFVHTfKEDZHVAwmN0YSCgYGqZ/JCTUD4eqMdEHKYQPGUDXKSYOqAcEiN1JIlADJCCM7oaUwgAMJ41STQLbYJt8kwchCKeEEZQhAN0Ut0hjqo58UD2OqZCSYKBAIcE8panmgYKBogeKXNBIc0a+SWcjRCIevNB0PikM9UZ2yUAQjCHapjbVBE5T5FBGNUzgaZQLJR5o8ks5QP 2023-24","qno":"3","marks":10,"co":"","bl":"","tags":[[3,"Normalization (1NF–BCNF)"]],"text":"Assume that you are the database designer at TeachEasy and you need to maintain the database for easier access and retrieval of records at any time. The database contains the following (Book ID, Published Date, Tutor ID, Title, Room, Phone Number, Block Number):\nB1, 23.02.23, Tut1, PYTHON, AB3310, 9940497934 & 9940497938, AB3\nB2, 18.11.23, Tut3, SQL, AB1331, 9876123456, AB1\nB3, 23.02.23, Tut1, MATLAB, AB2310, 9940497934 & 9940497938, AB2\nB5, 05.02.23, Tut3, JAVA, AB2332, 9876123459, AB2\nB4, 04.07.23, Tut5, AZURE, DB321, 9876543210, DB\nNormalize the given table up to the third level normal form with proper justifications for violations in each form."},{"id":"FAT-F2-2023-24|4","paper":"FAT-F2-2023-24","qno":"4","marks":10,"co":"","bl":"","tags":[[5,"Recovery Techniques"]],"text":"a. Banking System online application is used to store, manipulate and retrieve the customer's account details. Identity and describe the recovery techniques that can be applied for critical data restoration in case of some transaction failure or data corruptions. (4 Marks)\nb. Write the log records created during Deferred database modification and Immediate database modification for the following schedule. Assume that the initial values of A=1100, B=1200 and C=1000. (6 Marks)\nT0: Read(A); A:=A-550; Write(A); Read(B); B:=B+550; Write(B)\nT1: Read(C); C:=C-300; Write(C)"},{"id":"FAT-F2-2023-24|5","paper":"FAT-F2-2023-24","qno":"5","marks":10,"co":"","bl":"","tags":[[7,"CAP Theorem"]],"text":"a. Consider the Grade Monitoring System that maintains the grade of the students in an institute that enables the faculty to post the grade and students to view their grade. A faculty posts the grade of the student A from the node XYZ and the student A access his/her grade from the node PQR. Illustrate the CAP upholding using the given scenario. (8 Marks)\nb. Comment on the statement : \"Achieving CAP is not possible at all times in a distributed system\" (2 Marks)"},{"id":"FAT-F2-2023-24|6","paper":"FAT-F2-2023-24","qno":"6","marks":10,"co":"","bl":"","tags":[[4,"Relational Algebra & SQL"]],"text":"Consider the following student table (Reg.No, Name, Physics Marks, Chemistry Marks, Maths Marks, Age, Department, Residential City): (1001, Harish, 90, 80, 98, 19, SENSE, Chennai); (1002, Ram, 50, 95, 90, 20, SENSE, Bangalore); (1003, Suresh, 80, 85, 75, 19, SENSE, Mumbai); (1004, Dhamu, 95, 95, 55, 20, SCOPE, Kolkata); (1005, Pralhik, 85, 70, 85, 19, SENSE, Delhi); (1006, Gokul, 65, 52, 40, 18, SCOPE, Chennai).\nWrite SQL query for the following.\na. Add a new column \"Average\" in the above table and find the average of all the students (2 Marks)\nb. Display the name of all students whose residential city is either Chennai or Bangalore (2 Marks)\nc. List the name of all students in Upper Case those who are in the age 19 and studying in SENSE department (2 Marks)\nd. Display the minimum and maximum age of the students (2 Marks)\ne. Find the student name and department whose average mark above 80 department wise (2 Marks)"},{"id":"FAT-F2-2023-24|7","paper":"FAT-F2-2023-24","qno":"7","marks":10,"co":"","bl":"","tags":[[4,"Relational Algebra & SQL"]],"text":"a. The management team wanted to check whether a particular faculty in the university is employed or not. Write a PL/SQL function to assist the management team so that a message is displayed as \"Employed\" Otherwise \"Not Employed\". (5 Marks)\nb. Create an explicit cursor named university_cur and fetch the details of all students in the student table whose department is SENSE. Also, Illustrate the ROWCOUNT using implicit cursor. (5 Marks)\nNote: Assume the required tables with data are already existing in the database."},{"id":"FAT-F2-2023-24|8","paper":"FAT-F2-2023-24","qno":"8","marks":15,"co":"","bl":"","tags":[[4,"Relational Algebra & SQL"],[4,"Query Processing & Optimization"],[4,"Hashing Techniques"]],"text":"Consider the following relations of a university database.\nFaculty (EmpId, Name, Phno, School, DateOfJoining)\nStudent (RegNo, Name, Phno, School)\nCourse (CourseCode, CourseName, Credits)\nCourseAllocation (ClassNumber, AEmpId, ACourseCode, Venue, MaxStrength, Slot)\nStudReg (RegNo, ClassNumber)\na. Write a relational algebra query and depict a query tree to find Name and Phone numbers of Faculty members who have joined after 01-01-2023 and handling DBMS course. (5 Marks)\nb. Convert the constructed canonical tree into optimized tree using Heuristic technique. (5 Marks)\nc. The Keys 12, 18, 13, 2, 3, 23, 5 and 15 are inserted into an empty hash table of length 8 using open addressing with hash function h(k)=k mod 8. Show the resultant hash table of each key entries (5 Marks)"},{"id":"FAT-F2-2023-24|9","paper":"FAT-F2-2023-24","qno":"9","marks":15,"co":"","bl":"","tags":[[6,"Concurrency Problems"],[6,"Lock-Based Protocols & 2PL"]],"text":"Consider the Concurrent Transaction and initial values of A, B and C are 200, 200, and 380 respectively:\nT1: Tx Read(A) | Ty Read(A)\nT2: Tx Read(B) | Ty Read(B)\nT3: Tx Write(B=A+100)\nT4: Tx Write(C=C+B*2) | Ty Write(B=A+100)\nT5: Tx Read(C) | Ty Write(C=C+B*2)\nT6: Tx Read(A) | Ty Read(A)\nT7: Tx Read(B) | Ty Read(B)\nT8: Ty Read(C)\na. Identify and elaborate the issues on the concurrent transaction as given in the above table (4 Marks)\nb. Illustrate the solution to overcome the problems using lock based protocol (basic, Strict and Rigorous) with proper justification (11 Marks)"},{"id":"FAT-A1-2024-25|1","paper":"FAT-A1-2024-25","qno":"1","marks":10,"co":"CO1","bl":"L1","tags":[[1,"Data Models & Three-Schema Architecture"]],"text":"Discuss three-schema architecture used in database management. What are the key components, and how do they interact with each other? Why do we need mappings between schema levels?"},{"id":"FAT-A1-2024-25|2","paper":"FAT-A1-2024-25","qno":"2","marks":10,"co":"CO2","bl":"L3","tags":[[2,"ER Model"]],"text":"Design an Entity-Relationship Diagram (ER Diagram) for a Hospital Management System (HMS) that enables the registration and management of patient information, including demographics, medical history, and current condition, while featuring a doctor directory that maintains details such as specialties, contact information, and availability. The system should assist in room management by identifying available and occupied rooms, and handle nurse information, including departmental assignments and shift schedules. Additionally, it must provide functionality for generating, storing, and retrieving patient test reports with detailed results and dates, while managing records through unique identification numbers for easy reference. Billing functionality is crucial for handling billing information, including bill generation and payment tracking, and the system should support receptionist functions for retrieving patient data and scheduling appointments. Your task is to create an ER diagram that includes relevant entities, attributes and relationships, indicating cardinality and participation constraints."},{"id":"FAT-A1-2024-25|3","paper":"FAT-A1-2024-25","qno":"3","marks":10,"co":"CO2","bl":"L2","tags":[[2,"Extended ER Model"]],"text":"Discuss the concepts of generalization and specialization in database design, using the extended entity-relationship model as a framework. Provide examples to illustrate these concepts and analyze the various types of constraints, including disjointness and completeness, and their impact on subclass relationships and the overall superclass structure."},{"id":"FAT-A1-2024-25|4","paper":"FAT-A1-2024-25","qno":"4","marks":10,"co":"CO2","bl":"L3","tags":[[3,"Lossless Decomposition & Dependency Preservation"]],"text":"Consider relation R(X,Y,Z,W,V) with the following functional dependencies: X→Y, Y→Z, Z→W, W→X. The decomposed Relations are R1(X,Y,Z) and R2(Z,W,V). Find if all the original dependencies are preserved or not. Steps are required."},{"id":"FAT-A1-2024-25|5","paper":"FAT-A1-2024-25","qno":"5","marks":10,"co":"CO2","bl":"L3","tags":[[3,"Normalization (1NF–BCNF)"]],"text":"Consider the relation R(P,Q,R,S,T,U,V,W,X,Y) with the following set of functional dependencies: PQ→R, P→ST, Q→UV, U→WX, S→Y. Normalize the schema into Third Normal Form (3NF). Provide the resulting relations and explain the decomposition process for any violations encountered."},{"id":"FAT-A1-2024-25|6","paper":"FAT-A1-2024-25","qno":"6","marks":10,"co":"CO4","bl":"L2","tags":[[5,"Recovery Techniques"]],"text":"You are the database administrator for an e-commerce platform that processes customer orders and manages payment transactions. When users transfer funds between their accounts, the system ensures that funds are only deducted after the user confirms the transaction. Simultaneously, the platform allows customers to place orders, reflecting inventory changes in real-time to prevent overselling of items. To safeguard against system failures, the application creates backup copies of database pages for quick recovery. This layered database recovery approach aims to maintain data integrity and reliability while providing a seamless user experience, even in the event of a transaction error or system crash.\ni. Identify and describe the approach taken for handling fund transfers and explain why this method is suitable for this scenario.\nii. Explain the backup strategy implemented for recovering the database. How does this method enhance the recovery process, and what are its limitations?"},{"id":"FAT-A1-2024-25|7","paper":"FAT-A1-2024-25","qno":"7","marks":10,"co":"CO4","bl":"L4","tags":[[5,"Schedules & Serializability"]],"text":"Identify and justify how the following concurrency control problems affect data integrity and consistency in a multi-user environment.\nS1: r1(x);r2(x);w1(x);r3(x);w2(x);c2;r4(x);w3(x);c3;w1(y);c1;\nS2: r1(x);w1(x);r2(x);w2(x);c2;r3(x);c3;w1(y);c1;\nS3: r1(x); w1(x); r2(x); w2(x); r1(x);\n(Justification needed: S1 – Lost Update Problem; S2 – Dirty Read Problem; S3 – Unrepeatable Read Problem)"},{"id":"FAT-A1-2024-25|8","paper":"FAT-A1-2024-25","qno":"8","marks":10,"co":"CO5","bl":"L1","tags":[[7,"CAP Theorem"]],"text":"Explain the CAP theorem and its implications for distributed system databases. Analyze how the CAP theorem influences the database design choices of an online shopping platform, focusing on the trade-offs between consistency, availability, and partition tolerance. Summarize how the CAP theorem informs the design and operational choices of the online shopping platform. Reflect on the practical implications of balancing consistency, availability, and partition tolerance in real-world distributed systems."},{"id":"FAT-A1-2024-25|9","paper":"FAT-A1-2024-25","qno":"9","marks":10,"co":"CO3","bl":"L3","tags":[[4,"B+ Tree Indexing"],[4,"Hashing Techniques"]],"text":"Show the B+ tree that would be formed by inserting the month names (12 strings) into a tree in their normal calendar sequence (jan, feb, mar, apr, may, jun, jul, aug, sep, oct, nov, dec). After the construction, delete the entries for dec and mar.\n(OR)\nInsert the elements 15, 20, 25 and 30 into a hash table of size 10. Assume that h1(k) = 2K+3. The hash value is calculated from the formula h1(k) % table size. The tables do not need to be resized. If an element cannot be inserted successfully, state why. You need to display it up to the final table.\ni. Perform quadratic probing\nii. Perform Double Hashing by using the secondary hash function h2(k) = 3K+1"},{"id":"FAT-A1-2024-25|10","paper":"FAT-A1-2024-25","qno":"10","marks":10,"co":"CO4","bl":"L3","tags":[[6,"Lock-Based Protocols & 2PL"],[6,"Timestamp-Based Protocols"]],"text":"i. Discuss different types of Two-Phase Locking (2PL) algorithms with an example.\nConsider the following two transactions and schedule (time goes from top to bottom). [schedule table given in original paper]\nii. Demonstrate how Two-Phase Locking (2PL) ensures a conflict-serializable schedule for the transactions mentioned above, using the notation Li[x] to indicate that transaction i acquires a lock on element x and Ui[x] to indicate that transaction i releases its lock on x.\niii. Illustrate how using locks without 2PL can result in a schedule that is not conflict-serializable.\n(OR) Consider the following transactions with their respective timestamps: T1: Timestamp = 150, T2: Timestamp = 250, T3: Timestamp = 350. Given the schedule of operations: S: R1(X); R2(Y); W1(Z); R3(Y); W2(X); R1(Y); W3(Z)\ni. Apply the Timestamp Ordering Protocol to determine the order of transaction execution.\nii. Identify which operations are allowed and which are aborted based on the protocol rules.\niii. Explain the reasons for any transaction aborts in the schedule and discuss how this affects the overall consistency of the transactions."},{"id":"FAT-A2-2024-25|1","paper":"FAT-A2-2024-25","qno":"1","marks":10,"co":"","bl":"","tags":[[1,"Data Models & Three-Schema Architecture"]],"text":"i. [4] Explain the difference between a database schema and a database state with a suitable example.\nii. [6] Differentiate between logical data independence and physical data independence, providing examples to illustrate their concepts. Finally, discuss the challenges and benefits associated with achieving these levels of data independence."},{"id":"FAT-A2-2024-25|2.a","paper":"FAT-A2-2024-25","qno":"2.a","marks":10,"co":"","bl":"","tags":[[2,"Extended ER Model"]],"text":"Design an EER diagram to capture the requirements of an e-commerce platform that sells products online. The platform should allow users to browse products, add them to their shopping carts, checkout, and track their orders. Every product has a unique ID, name, description, price, quantity in stock, and category. Categories represent different product groups (e.g., electronics, clothing, books). Products can be categorized into different types (e.g., books, electronics, and clothing). Every customer has a unique ID, name, email, address, and shipping information. Each order has a unique ID, customer ID, order date, shipping address, and total amount. Each order can have multiple items. An order item specifies the product ID, quantity, and price. Each order has associated payment information, including payment method, transaction ID, and payment status. Customers can leave reviews for products, including a rating and a text comment. The platform can offer promotions and discounts on products. State any assumptions you have that affects your design. Clearly indicate primary keys and the cardinalities with which an entity participates in a relationship with a pair of (minimum, maximum) value."},{"id":"FAT-A2-2024-25|2.b","paper":"FAT-A2-2024-25","qno":"2.b","marks":10,"co":"","bl":"","tags":[[2,"Mapping ER to Relational Schema"]],"text":"(OR) Map the following ER diagram into relational schema(s) and specify all the relevant primary keys and foreign keys.\n[DIAGRAM: ER diagram with entities Exam (code, description, cost), Patient (sin, pname (pfname, plname), sex), Doctor (doctorid, tel, office, dname (fname, lname), speciality), Clinic (cname, rooms); relationships Undertakes (Exam–Patient–Doctor, with result), HostedBy (Patient–Clinic, start_date, end_date), WorksIn (Doctor–Clinic, start_date), Manages (Doctor–Clinic) with (min,max) participation constraints.]","fig":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAIzAxoDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAUGAgMEAQf/xABWEAABAwMCAgYFCQMGCggHAQEBAAIDBAUREiEGMRMiQVFhcRQygZGhFSMzQlJicrHBBxbRJHOCorLCNENTZIOSo9Lh8CUmNkVjk7PxFzVEVFV0hGXD/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//EABsRAQEBAAMBAQAAAAAAAAAAAAABERIhMQJB/9oADAMBAAIRAxEAPwD6oiIgIiICIiAiIgIiICIiAiIgZXjXB7cjOPEYXqICIiAiIgIiICIiAixfIyNpc9zWtHMk4Cj6jiC00201xpWnJGOlB s"],[3,"Normalization (1NF–BCNF)"]],"text":"Suppose we have a database for an investment firm, consisting of the following attributes: B – Broker, O – Office of a broker, I – Investor, S – Stock, Q – Quantity of stock owned by an investor, D – Dividend paid by a stock. Hence, the overall schema is R = (B, O, I, S, Q, D). Assume that the following functional dependencies are required to hold on this database. FD = {I → B, IS → Q, B → O, S → D}\ni) List all the candidate keys for R.\nii) List the prime and non-prime attributes.\niii) Classify to which normal form the present form of Relation R belongs to and justify the answer.\niv) Identify the FD's which violates the property of a particular normal form and perform lossless-join decomposition of R into subsequent normal forms (continue up to BCNF)."},{"id":"FAT-A2-2024-25|4","paper":"FAT-A2-2024-25","qno":"4","marks":10,"co":"","bl":"","tags":[[3,"Functional Dependencies & Axioms"],[3,"Lossless Decomposition & Dependency Preservation"]],"text":"i. [4] Consider the following relation R = {A, B, C, D, E} and the two sets of functional dependencies: F1 = {A → B, A → C, B → D, C → E}; F2 = {A → B, C → D, B → E}. Check whether F1 and F2 are equivalent.\nii. [6] Suppose you are given a relation R(A,B,C,D). For each of the following sets of FDs, assuming the followings are the only dependencies that hold for R, identify the candidate key(s) for R. Also state whether or not the proposed decomposition of R into smaller relations is a good decomposition (lossy or lossless) and briefly explain why or why not.\na) B→C, D→A; decompose into BC and AD.\nb) A→BC, C→AD; decompose into ABC and AD.\nc) A→B, B→C, C→D; decompose into AB and ACD."},{"id":"FAT-A2-2024-25|5.a","paper":"FAT-A2-2024-25","qno":"5.a","marks":10,"co":"","bl":"","tags":[[4,"B+ Tree Indexing"]],"text":"Suppose we start with an empty B+ tree and keys arrive in the following order: 23, 7, 12, 20, 45, 30, 9, 14, 70, 25, 19, 8, 21, 17, 84. Construct a B+ tree of order 3. Delete 23, 9, 30, 20, 25 from the tree. Display the resultant tree after each deletion."},{"id":"FAT-A2-2024-25|5.b","paper":"FAT-A2-2024-25","qno":"5.b","marks":10,"co":"","bl":"","tags":[[4,"Hashing Techniques"],[4,"Relational Algebra & SQL"]],"text":"(OR)\ni) [5] Suppose that extendable hashing is being used on a database file that contains records with the following search key values: 8, 16, 4, 3, 14, 11, 12, 23, 42, 21. Construct the extendable hash structure for this file using the lowest-bits for the hash function (after converting the numbers into its binary form). That is, records in a bucket of local depth 'd' agree on their rightmost 'n' bits. For example, the key 3 (0011) and 11 (1011) agree on their rightmost 3 bits (011). Each bucket can hold two records. Answer the followings based on the constructed extendable hash structure.\n1) What is the global depth of the resulting directory?\n2) What is the local depth of the bucket contains key 14?\nii) [5] Consider the following Publication Database (tables Author, Author_Publication, Book, Publication – see figure). Based on the above database, answer the followings:\n1) Write a relational algebra expression that returns the names of all authors who have at least one publication in the database.\n2) Write a relational algebra expression that returns the names of all authors who are not book editors.\n3) What question does the following expression answer? Author * (Author_Publication * (σ month='July' (Book) * Publication))\n4) What question does the following relational algebra expression answer? |π author_id (author) − π editor (book)|\n5) How many tuples are returned by the following relational algebra expression? author ⋈ author_id=editor book","fig":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAG5Ax8DASIAA  an initial balance of $100. A transaction transfers $50 to another account. The database must ensure that the total balance of all accounts remains consistent before and after the transaction.\nb) The system experiences a power outage during a transaction. The transaction should be recoverable upon system restart.\nc) Multiple customers are trying to purchase the last available item of a product. The system should ensure that only one customer is able to successfully purchase the item, preventing race conditions.\nd) A customer places an order for multiple items. The transaction should either be fully committed (all items are added to the order and payment is processed) or fully rolled back (no changes are made to the database)."},{"id":"FAT-A2-2024-25|7","paper":"FAT-A2-2024-25","qno":"7","marks":10,"co":"","bl":"","tags":[[5,"Schedules & Serializability"]],"text":"Define conflict serializable, recoverable, cascadeless, and strict schedules. For each of the following schedules, state which of the above mentioned properties hold. Justify your answer.\na) S1: R1(X), W2(X), W1(X), A2, C1\nb) S2: R1(X), W2(X), W1(X), C2, C1\nc) S3: R1(X), R2(X), W1(X), C1, W2(X), C2\nd) S4: W1(X), R2(X), W1(X), C2, A1\ne) S5: W1(X), R2(Y), R1(Y), R2(X), C1, C2\nf) S6: R1(X), R2(X), C1, W2(X), C2"},{"id":"FAT-A2-2024-25|8","paper":"FAT-A2-2024-25","qno":"8","marks":10,"co":"","bl":"","tags":[[6,"Deadlock Handling"]],"text":"Analyze the trade-offs between different locking mechanisms and deadlock prevention protocols in terms of concurrency, performance, and overhead. Consider a scenario of a distributed database system, which is used to manage airline reservations, might encounter a deadlock situation. Explain how binary locks, exclusive/shared locks, and deadlock prevention protocols could be used to prevent or resolve the deadlock. [question number and first line partly cut off in the scan]"},{"id":"FAT-A2-2024-25|9","paper":"FAT-A2-2024-25","qno":"9","marks":10,"co":"","bl":"","tags":[[6,"Lock-Based Protocols & 2PL"]],"text":"i. [5] Explain why two-phase locking (2PL) is generally not used as a concurrency control method for indexes such as B+ trees. Provide a concrete example to illustrate the limitations of 2PL in this context.\nii. [5] Discuss the advantages and disadvantages of strict 2PL compared to other concurrency control mechanisms. Show that strict 2PL disallows the following schedule.\nR1(X) → R1(Y) → R2(X) → W2(X) → R2(Y) → W1(X) → W1(Y) → W2(Y) → C1 → C2"},{"id":"FAT-A2-2024-25|10","paper":"FAT-A2-2024-25","qno":"10","marks":10,"co":"","bl":"","tags":[[7,"NoSQL Database Types"]],"text":"Given a large-scale e-commerce application that requires high availability, low latency, and the ability to handle massive amounts of transactional data, which NoSQL database types would be most suitable? Justify your answer with specific scenarios to illustrate the key considerations. Discuss why other NoSQL types might not be suitable."},{"id":"FAT-B1-2025-26|1","paper":"FAT-B1-2025-26","qno":"1","marks":10,"co":"CO1","bl":"BL2","tags":[[1,"DBMS Architectures"]],"text":"Compare and contrast centralized and client/server architectures for DBMS. Discuss the pros and cons of each approach?"},{"id":"FAT-B1-2025-26|2","paper":"FAT-B1-2025-26","qno":"2","marks":10,"co":"CO1","bl":"BL4","tags":[[2,"ER Model"]],"text":"Imagine a university database system with the following requirements: The university has many Departments, each with a unique name and location. Each Department offers several Courses; each course has a unique course ID, title, and credits. Professors teach courses; each professor has an ID, name, and rank. A professor can teach multiple courses, and each course can be taught by multiple professors. Students enroll in courses; each student has a student ID, name, major department, and email. Each enrollment records the student's grade in that course.\na) Draw an ER diagram (Chen notation) representing this scenario.\nb) Identify entity types, attributes (simple, composite, derived, multi-valued if any), and relationships."},{"id":"FAT-B1-2025-26|3","paper":"FAT-B1-2025-26","qno":"3","marks":10,"co":"CO2","bl":"BL3","tags":[[3,"Functional Dependencies & Axioms"]],"text":"Given a relation schema R(A, B, C, D, E, F, G) and the following set of functional dependencies F:{A → BC, CD → E, B → D, E → F, F → G}, use Armstrong's axioms to derive the closure of {A}. Explain each inference step in detail."},{"id":"FAT-B1-2025-26|4","paper":"FAT-B1-2025-26","qno":"4","marks":10,"co":"CO3","bl":"BL4","tags":[[4,"Relational Algebra & SQL"],[4,"Query Processing & Optimization"]],"text":"Consider the following SQL query on relations Employees(EmpID, Name, DeptID), Departments(DeptID, DeptName), and Projects(ProjID, DeptID, Budget):\nSELECT E.Name, D.DeptName\nFROM Employees E\nJOIN Departments D ON E.DeptID = D.DeptID\nWHERE EXISTS (\n  SELECT * FROM Projects P\n  WHERE P.DeptID = D.DeptID AND P.Budget > 100000\n)\nTranslate this SQL query into the equivalent relational algebra expression using selection, projection and join.\nSuggest algebraic transformations to optimize the query execution."},{"id":"FAT-B1-2025-26|5","paper":"FAT-B1-2025-26","qno":"5","marks":10,"co":"CO4","bl":"BL2","tags":[[5,"Schedules & Serializability"]],"text":"Explain the concept of conflict serializability. Describe how to test for conflict serializability using precedence (conflict) graphs. Discuss with suitable example schedules."},{"id":"FAT-B1-2025-26|6","paper":"FAT-B1-2025-26","qno":"6","marks":10,"co":"CO5","bl":"BL3","tags":[[6,"Lock-Based Protocols & 2PL"]],"text":"i. [4] Describe the Two-Phase Locking protocol and its importance in ensuring serializability.\nii. [6] Discuss the differences between strict 2PL, rigorous 2PL, and basic 2PL, including their impact on system performance and recoverability."},{"id":"FAT-B1-2025-26|7","paper":"FAT-B1-2025-26","qno":"7","marks":10,"co":"CO5","bl":"BL1","tags":[[7,"CAP Theorem"]],"text":"i. [4] Explain the CAP theorem in the context of distributed NoSQL databases.\nii. [6] Discuss consistency, availability, and partition tolerance, and describe why a system can only guarantee two out of these three properties at any time."},{"id":"FAT-B1-2025-26|8","paper":"FAT-B1-2025-26","qno":"8","marks":10,"co":"CO3","bl":"BL3","tags":[[4,"B+ Tree Indexing"]],"text":"Given the following keys to be inserted into a B+ Tree of order 3 (i.e., max 2 keys per node): [5, 15, 25, 35, 45, 55, 65, 75]\ni. [3] Draw the resulting B+ Tree after all insertions.\nii. [3] Explain why B+ Tree is preferred over B-Tree for implementing database indexes.\niii. [4] Show how a range query like WHERE key BETWEEN 25 AND 65 is handled efficiently using the B+ Tree."},{"id":"FAT-B1-2025-26|9.a","paper":"FAT-B1-2025-26","qno":"9.a","marks":10,"co":"CO4","bl":"BL4","tags":[[6,"Concurrency Problems"],[6,"Deadlock Handling"]],"text":"Suppose we have a banking system with the following transactions running concurrently:\nT1: Transfers $200 from Account A to Account B.\nT2: Deposits $300 into Account A.\nT3: Reads the balance of Account A twice during concurrent operations.\nInitial account balances: Account A: $1000, Account B: $500\ni. Illustrate how the Lost Update Problem can occur with T1 and T2.\nii. Demonstrate potential deadlock conditions involving T1 and T3."},{"id":"FAT-B1-2025-26|9.b","paper":"FAT-B1-2025-26","qno":"9.b","marks":10,"co":"CO4","bl":"BL4","tags":[[5,"Recovery Techniques"]],"text":"(OR)\ni. [5] Discuss recovery methods based on immediate update. What measures ensure atomicity and durability in immediate update protocols?\nii. [5] Discuss concepts of compensation log records and check pointing."},{"id":"FAT-B1-2025-26|10.a","paper":"FAT-B1-2025-26","qno":"10.a","marks":10,"co":"CO5","bl":"BL2","tags":[[7,"NoSQL Database Types"]],"text":"Compare the main characteristics and use cases of the following NoSQL database types: key-value stores, column-family stores, document databases, and graph databases. Provide practical scenarios where each is best suited."},{"id":"FAT-B1-2025-26|10.b","paper":"FAT-B1-2025-26","qno":"10.b","marks":10,"co":"CO5","bl":"BL2","tags":[[6,"Deadlock Handling"]],"text":"(OR)\ni. [5] Analyze common causes of deadlocks in lock-based concurrency control.\nii. [5] Explain detection algorithms like wait-for graphs and how cycle detection is performed. Provide an example illustrating deadlock detection and resolution."},{"id":"FAT-B2-2025-26|1","paper":"FAT-B2-2025-26","qno":"1","marks":10,"co":"CO1","bl":"BL2","tags":[[1,"Data Models & Three-Schema Architecture"]],"text":"\"The three schema architecture is considered the backbone of data abstraction in database systems\". Justify this statement by explaining the three levels of database architecture and discuss how this model ensures logical and physical data independence with suitable examples."},{"id":"FAT-B2-2025-26|2","paper":"FAT-B2-2025-26","qno":"2","marks":10,"co":"CO1","bl":"BL2","tags":[[2,"ER Model"]],"text":"Design an ER diagram for a bank database system indicating entities, attributes, relationships and cardinalities. The bank maintains details of accounts, customers, loans, and payments. Each account has an account number and balance. Accounts are of two types: Savings Account and Current Account, which are specializations of the Account entity. Each customer has a unique customer ID, name, and address. A customer may hold multiple accounts, and an account may be jointly owned by more than one customer. Loans are identified by a loan number, amount, and type. A loan can have multiple payments, and each payment (with payment ID, amount, and date) is associated with exactly one loan."},{"id":"FAT-B2-2025-26|3","paper":"FAT-B2-2025-26","qno":"3","marks":10,"co":"CO2","bl":"BL5","tags":[[2,"Mapping ER to Relational Schema"]],"text":"Elucidate the systematic steps involved in translating an ER diagram into an equivalent relational schema, supplementing your explanation for the ER diagram of the previous question. [page partly blurred in source]"},{"id":"FAT-B2-2025-26|4","paper":"FAT-B2-2025-26","qno":"4","marks":10,"co":"CO3","bl":"BL3","tags":[[3,"Normalization (1NF–BCNF)"]],"text":"Given a relation STUDENT_COURSE (StudentID, StudentName, CourseID, CourseName, InstructorID, InstructorName, InstructorDept). Normalize this relation step by step up to Third Normal Form with proper explanation clearly showing the functional dependencies at each stage and explaining the decomposition process. Illustrate the final set of relations obtained in 3NF. Justify your answer."},{"id":"FAT-B2-2025-26|5","paper":"FAT-B2-2025-26","qno":"5","marks":10,"co":"CO3","bl":"BL2","tags":[[4,"File Organization & Indexing"]],"text":"Examine multilevel indexing techniques employed in database systems, and illustrate each with appropriate real-world examples to demonstrate their practical application."},{"id":"FAT-B2-2025-26|6","paper":"FAT-B2-2025-26","qno":"6","marks":10,"co":"CO3","bl":"BL2","tags":[[4,"Relational Algebra & SQL"]],"text":"Consider the following database schema for a library:\n• BOOK(BookID, Title, PublisherID, Year)\n• PUBLISHER(PublisherID, PublisherName, Address)\n• MEMBER(MemberID, MemberName, MemberType)\n• BORROW(BookID, MemberID, BorrowDate, ReturnDate)\nUsing the above schema, express the following queries in Relational Algebra:\ni. Retrieve the names of members who have borrowed the book titled \"Database Systems\".\nii. List all book titles published by the publisher named \"Pearson\".\niii. Find the names of members who have borrowed at least one book but have not yet returned it.\niv. For each publisher, display the publisher name and the total number of books published.\nv. Retrieve the titles of books that have never been borrowed by any member."},{"id":"FAT-B2-2025-26|7","paper":"FAT-B2-2025-26","qno":"7","marks":10,"co":"CO4","bl":"BL2","tags":[[5,"Schedules & Serializability"]],"text":"Consider the following schedules of transactions in a database system:\ni. S1 = r1(A); r2(A); w1(A); w2(A)\nii. S2 = r1(X); w2(Y); w1(Y); r2(X)\niii. S3 = r1(A); r2(B); w1(B); w2(A); r3(A); w3(B)\nTransactions: (T1: r(A); w(A); r(B); w(B)) (T2: r(B); w(B); r(A); w(A))\na) For each schedule, determine whether it is conflict-serializable.\nb) For the schedules that are conflict-serializable, draw the precedence (serializability) graph and provide an equivalent serial schedule.\nc) For the transactions T1 and T2, construct a conflict-serializable schedule and explain the steps you used to ensure serializability.\nd) Explain the concept of conflict-serializability and how precedence graphs are used to verify it."},{"id":"FAT-B2-2025-26|8","paper":"FAT-B2-2025-26","qno":"8","marks":10,"co":"CO4","bl":"BL3","tags":[[5,"Transaction Concepts & ACID"],[5,"Recovery Techniques"]],"text":"a) [5] Illustrate the various states involved in database transaction.\nb) [5] Discuss the Shadow Paging technique in database management systems, elaborating on its working and significance in detail."},{"id":"FAT-B2-2025-26|9.a","paper":"FAT-B2-2025-26","qno":"9.a","marks":10,"co":"CO4","bl":"BL2","tags":[[6,"Lock-Based Protocols & 2PL"]],"text":"A database system uses the Two-Phase Locking (2PL) protocol to manage concurrent transactions. Consider the following transactions:\n• T1: Read(A); Write(A); Read(B); Write(B)\n• T2: Read(B); Write(B); Read(C); Write(C)\n• T3: Read(C); Write(C); Read(A); Write(A)\ni. Draw a possible schedule of these transactions under 2PL.\nii. Show where deadlock can occur, if any.\niii. Suggest how deadlock can be avoided or resolved in this case."},{"id":"FAT-B2-2025-26|9.b","paper":"FAT-B2-2025-26","qno":"9.b","marks":10,"co":"CO4","bl":"BL2","tags":[[6,"Multi-Granularity Locking"]],"text":"(OR) A database system implements multi-granularity locking (MGL) with lock modes: IS, IX, S, X, and uses a lock hierarchy (Database → Table → Page → Tuple). Two transactions are running concurrently:\n• T1: Needs to update a set of tuples in Table A.\n• T2: Needs to scan Table A in shared mode to read all tuples.\ni. Show the sequence of lock requests for both T1 and T2 under multi-granularity locking.\nii. Illustrate how intention locks help avoid deadlocks in this situation.\niii. Explain why MGL improves concurrency compared to simple table-level locking."},{"id":"FAT-B2-2025-26|10.a","paper":"FAT-B2-2025-26","qno":"10.a","marks":10,"co":"CO5","bl":"BL2","tags":[[7,"CAP Theorem"]],"text":"Explain the CAP Theorem in the context of NoSQL databases. How does it influence the design trade-offs in distributed systems?"},{"id":"FAT-B2-2025-26|10.b","paper":"FAT-B2-2025-26","qno":"10.b","marks":10,"co":"CO5","bl":"BL2","tags":[[7,"NoSQL Database Types"]],"text":"(OR) Differentiate the major types of NoSQL databases in terms of their data models, usage scenarios, and advantages, illustrating how each type serves specific application needs."},{"id":"FAT-E1-2025-26|1","paper":"FAT-E1-2025-26","qno":"1","marks":10,"co":"CO1","bl":"K2","tags":[[1,"Data Models & Three-Schema Architecture"]],"text":"a. Assume that you are responsible for designing the database system of \"Z-Bank\" banking application that manages account balances, transaction histories, and transaction processing efficiently. Analyze and describe the functionality of each layer in the three-schema architecture for this system with a neat diagram. Also, discuss how this architecture ensures data independence, security, and efficient data management. (7 marks)\nb. In the \"Z-Bank\" database system, multiple users may perform transactions such as deposits and withdrawals simultaneously. Identify the components in the DBMS architecture that are responsible for maintaining transaction consistency and restoring data after failures. How do these components ensure data reliability and smooth transaction processing in a multi-user banking environment? Justify your answer. (3 marks)"},{"id":"FAT-E1-2025-26|2","paper":"FAT-E1-2025-26","qno":"2","marks":10,"co":"CO1","bl":"K3","tags":[[2,"Extended ER Model"]],"text":"Design an Enhanced Entity-Relationship (EER) diagram for the following university academic management system. Your diagram should clearly specify entities, attributes (including keys), relationships, participation constraints, cardinalities, and any specialization or aggregation used. State any assumptions you make. The university manages its academic programs, courses, faculty, students, and course offerings.\n• The university is organized into several Faculties (e.g., Engineering, Science, Arts). Each faculty has a FacultyID, name, and dean.\n• Each faculty is divided into multiple Schools (e.g., School of Computer Science, School of Physics). Each school has a SchoolID, name, and head.\n• Each School offers several Programs (e.g., B.Tech CSE, M.Sc Physics). Each program has a ProgramID, name, duration, and degree type.\n• Each Program consists of multiple Courses. Each course has a CourseID, title, credits, and semester offered.\n• Lecturers teach courses. Each lecturer has a LecturerID, name, email, and specialization. A lecturer can teach multiple courses, and a course can be taught by multiple lecturers (possibly in different semesters).\n• Students enroll in one program but can register for multiple courses each semester. Each student has a StudentID, name, year of study, and program enrolled.\n• For each Course Offering (a course taught in a specific semester), record the CourseID, Semester, Year, LecturerID(s), and number of students enrolled.\n• Students receive grades for each course offering. Grades are recorded as A/B/C/D/F.\n• Some courses are electives and can be chosen by students from any program, while others are core and mandatory for specific programs.\n• There are specializations for students: Undergraduate and Postgraduate. Postgraduate students may have a thesis title and a supervisor (who is a lecturer).\n• The university tracks prerequisite relationships between courses (e.g., Course A is a prerequisite for Course B)."},{"id":"FAT-E1-2025-26|3","paper":"FAT-E1-2025-26","qno":"3","marks":10,"co":"CO2","bl":"K3","tags":[[3,"Functional Dependencies & Axioms"],[3,"Normalization (1NF–BCNF)"]],"text":"Assume that XYZ university maintains a database to manage students' course registrations with the following attributes: StudentID (S), StudentName (SN), DeptID (D), DeptName (DN), CourseID (C), CourseName (CN), Credits (CR), Semester (SM), Year (Y), CourseInstructor (CI), DepartmentDean (DD).\nAssumptions: Each student has a unique name and belongs to a single department. Each department has a unique name and a dean. Each course has a unique name and credit value. Each student-course combination determines the semester and year of enrollment. Each course in a semester is taught by exactly one instructor. For each student-course combination, the earned marks are uniquely determined.\na. Derive the set of functional dependencies (FDs) based on the assumptions described above and compute the minimal cover (canonical cover) using step by step process. (7 marks)\nb. Consider the relation: R(A, B, C, D, E, F, G) with the following functional dependencies: F={A→BC, B→D, CD→E, E→F, F→G}. Using Armstrong's inference rules derive the following functional dependency: A → G. Show each step of the derivation and explicitly state which inference rule is applied at each step. (3 marks)"},{"id":"FAT-E1-2025-26|4","paper":"FAT-E1-2025-26","qno":"4","marks":10,"co":"CO2","bl":"K3","tags":[[3,"Normalization (1NF–BCNF)"]],"text":"Consider the following sample data of the relation \"Supply_Order\" for a farm supply management database at AgriGrow Pvt. Ltd. (Columns: SO_ID, Farm_ID, Sdate, Product_ID, Qty_Supplied, Total_Price)\n101, F01, 6-10-2025, P201 P202, 4 3, 10000\n102, F02, 6-10-2025, P201 P203 P205, 4 2 4, 15000\n103, F03, 4-11-2024, P203 P202, 3 2, 13000\n104, F04, 8-10-2024, P201 P205, 6 4, 11000\n105, F05, 7-10-2025, P207, 1, 5000\ni. Illustrate examples of update, insertion, and deletion anomalies caused by data redundancy for the given \"Supply_Order\" table. (3 marks)\nii. Normalize the relation \"Supply_Order\" to Third Normal Form showing the step by step process with proper justification. Clearly list candidate keys, functional dependencies, partial and transitive dependencies, and justify each decomposition step. State any assumptions you make. (7 marks)\n[Sample values partly unclear in the scan]"},{"id":"FAT-E1-2025-26|5","paper":"FAT-E1-2025-26","qno":"5","marks":10,"co":"CO3","bl":"K4","tags":[[4,"B+ Tree Indexing"]],"text":"A university is implementing a B+ tree index of order 4 on its Student Records table to efficiently manage student information. A batch of new students has joined the university, and their names, in order of arrival, are Ritan, Harini, Vinu, Nousthad, Harish, Vincent, Kapil, Rohit, Aaron, Ishan, Yash, Robert, Salman, and Sana. You are required to insert these names into the B+ tree one by one, maintaining lexicographic order within the nodes.\ni. Show the structure of the tree after each insertion, clearly indicating any leaf node splits and promotions to parent or root nodes. (7 marks)\nii. Delete the students names – \"Sana\", \"Vincent\", \"Rohit\" from the constructed B+ tree, and show the updated tree after each deletion. Indicate any merges or redistributions required to maintain the properties of the B+ tree. (3 marks)"},{"id":"FAT-E1-2025-26|6","paper":"FAT-E1-2025-26","qno":"6","marks":10,"co":"CO3","bl":"K5","tags":[[4,"Hashing Techniques"]],"text":"a. A bank maintains a file of CUSTOMER ACCOUNTS with \"Account No\" values as the hash key. The file is organized into seven buckets (numbered B0-B6). Each bucket corresponds to one disk block and can hold two customer accounts records. The following Account No values are to be inserted in the given order: 1025, 2378, 3541, 4680, 5297, 6432, 7189, 2987, 4756, 6890, 7543 using the hash function h(K)=K mod 7. Insert the records into the file using the given hash function. Show bucket assignments clearly, including any overflow blocks created. (3 marks)\nb. Using the above Account No values (used in 6.a) suppose the bank stores them in a hash table using quadratic probing, with 7 slots (B0-B6), and one record per slot.\ni. Draw the final hash table after all insertions using quadratic probing and show the \"Account No\" values that are not mapped to the hash table. (3 marks)\nii. As a computer architect, propose a solution and modified hash function to map all the hash keys in the above scenario using quadratic probing. Show the hash table after all insertions using modified hash function for quadratic probing. (4 marks)"},{"id":"FAT-E1-2025-26|7","paper":"FAT-E1-2025-26","qno":"7","marks":10,"co":"CO4","bl":"K4","tags":[[5,"Schedules & Serializability"],[5,"Recovery Techniques"]],"text":"a. Consider the precedence graph given below (nodes T1–T5). Is the corresponding schedule conflict serializable? If yes list the valid serial schedule(s) and explain your answer with proper justification. (4 marks)\n[DIAGRAM: precedence graph on transactions T1, T2, T3, T4, T5]\nb. Consider a bank database with a Customer_Account A having an initial balance of ₹1000. Four transactions T1, T2, T3, and T4, execute as shown in the following timeline:\nt1: T1 Read(A); t2: T2 Read(A); t3: T1 A=A-200; t4: T1 Write(A); t5: T1 Commit; t6: T3 Read(A); t7: T2 A=A+500; t8: T2 Write(A); t9: T3 A=A-100; t10: T3 Write(A); t11: T3 Commit; t12: T4 Read(A); t13: T4 A=A+300; t14: T4 Write(A); t15: System Crash.\ni. List the log entries for all transactions in the given timeline using \"NO-UNDO/REDO\" and \"UNDO/REDO\" protocols. Identify which transactions require redo or undo after a system crash at t15 in both protocols. (4 marks)\nii. Determine the final value of account A after recovery for both protocols. (2 marks)","fig":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wB
